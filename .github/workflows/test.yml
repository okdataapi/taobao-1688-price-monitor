name: test

# The offline tests: a local mock of the API, no key, no network, no cost.
# uv fetches the Python version, so the oldest supported one (3.9) is tested on any runner image.
on:
  push:
    paths-ignore: ["data/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python ${{ matrix.python-version }} python -m unittest discover -s tests -v
